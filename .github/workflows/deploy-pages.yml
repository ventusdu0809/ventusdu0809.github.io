name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Determine Pages base path
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          if [[ "$repository_name" == *.github.io ]]; then
            echo "PAGES_BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "PAGES_BASE_PATH=/$repository_name/" >> "$GITHUB_ENV"
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Build static Pages site
        run: npm run build:pages

      - name: Verify build output
        run: npm run verify:pages

      - name: Check deployment entry point
        shell: bash
        run: |
          test -d pages-dist || { echo "pages-dist is missing"; exit 1; }
          test -f pages-dist/index.html || { echo "pages-dist/index.html is missing"; exit 1; }

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
